# The database's nightly backup (server/scripts/backup.sh). It does nothing until the repository variable BACKUPS_ON is
# "true", set when the server goes live (server/README.md). A failed run emails the repository's owner.
# GitHub pauses scheduled runs of a public repository after 60 days without activity, and says so by email: turn it
# back on under Actions.
name: Nightly backup

on:
  schedule:
    - cron: '0 6 * * *' # 03:00 in Brazil
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backup:
    if: vars.BACKUPS_ON == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci --omit=dev --no-audit --no-fund -w @quilt/server -w @quilt/shared
      - name: Copy, encrypt and store
        run: bash server/scripts/backup.sh
        env:
          BACKUP_DATABASE_URL: ${{ secrets.BACKUP_DATABASE_URL }}
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
          BACKUP_S3_ENDPOINT: ${{ secrets.BACKUP_S3_ENDPOINT }}
          BACKUP_S3_BUCKET: ${{ secrets.BACKUP_S3_BUCKET }}
          BACKUP_S3_ACCESS_KEY_ID: ${{ secrets.BACKUP_S3_ACCESS_KEY_ID }}
          BACKUP_S3_SECRET_ACCESS_KEY: ${{ secrets.BACKUP_S3_SECRET_ACCESS_KEY }}
