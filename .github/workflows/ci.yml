# The same checks as on a computer (CLAUDE.md, "Commands"), on every pull request and every change to main.
# They only report. To make GitHub refuse a merge while they fail, turn on a branch rule for main in the
# repository's settings.
name: CI

on:
  pull_request:
  push:
    branches: [main]

# a newer push to the same pull request replaces the run still going
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # the database below; the tests make their own databases on this server and drop them after
  TEST_DATABASE_URL: postgres://quilt:quilt@localhost:5432/postgres

jobs:
  checks:
    name: Format, lint, types, unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      db:
        image: pgvector/pgvector:pg16 # the one in docker-compose.yml
        env:
          POSTGRES_USER: quilt
          POSTGRES_PASSWORD: quilt
          POSTGRES_DB: quilt
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U quilt" --health-interval 2s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
      # quilt.html is committed and is what gets published, so it has to be the build of the code next to it
      - name: The committed quilt.html is up to date
        run: git diff --exit-code --stat -- app/quilt.html

  browser-tests:
    name: Browser tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      db:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: quilt
          POSTGRES_PASSWORD: quilt
          POSTGRES_DB: quilt
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U quilt" --health-interval 2s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install the test browser
        run: npx playwright install --with-deps chromium
        working-directory: app
      - run: npm run build
      - run: npm run test:e2e
      - name: Keep what the failed tests left behind
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: app/test-results/
          retention-days: 7
