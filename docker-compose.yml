# Development services: PostgreSQL with pgvector, and MinIO (S3-compatible storage standing in for R2).
#   docker compose up -d
# then: cp server/.env.example server/.env && npm run dev -w @quilt/server
services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: quilt
      POSTGRES_PASSWORD: quilt
      POSTGRES_DB: quilt
    ports: ['5432:5432']
    volumes: ['pgdata:/var/lib/postgresql/data']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U quilt']
      interval: 2s
      retries: 20

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: quilt
      MINIO_ROOT_PASSWORD: quilt-dev-secret
    ports: ['9000:9000', '9001:9001'] # 9001: MinIO's web console
    volumes: ['minio:/data']

  # makes the bucket and lets the app (localhost:8000) upload to it from the browser
  minio-setup:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    depends_on: [minio]
    entrypoint: >
      sh -c "until mc alias set local http://minio:9000 quilt quilt-dev-secret; do sleep 1; done &&
             mc mb --ignore-existing local/quilt-fabrics &&
             mc anonymous set none local/quilt-fabrics"

volumes:
  pgdata:
  minio:
